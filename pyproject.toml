[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "carla-canvas"
dynamic = ["version"]
description = "Swap CARLA's camera and LiDAR rendering (3D Gaussian splatting or any renderer) behind the CARLA API, for typesafe_carla programs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# The renderer SDK (carla_canvas.Renderer, the service, ROS 2) needs only these:
# a renderer host (e.g. splatsim on a GPU machine) installs carla-canvas alone.
dependencies = [
    "grpcio>=1.84",
    "protobuf>=7.35.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
]
keywords = ["carla", "gaussian-splatting", "rendering", "simulation", "ros2", "grpc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# The client side: typesafe_carla programs with the sensor plugin (built when
# gRPC C++ and yaml-cpp are installed; see README). Needs the sensor source C ABI
# 5.3, the release after typesafe-carla 0.8.1.
client = ["typesafe-carla>0.8.1"]
# ROS 2 output without a ROS installation: DDS with ROS 2's wire types.
ros = ["cyclonedds>=0.10"]
# GPU 3D Gaussian splatting (gsplat's CUDA rasterizer).
gsplat = ["torch>=2.1", "gsplat>=1.0"]

[project.scripts]
carla-canvas = "carla_canvas.cli:main"

# typesafe_carla's launcher loads the plugin when CARLA_CANVAS_CONFIG is set.
[project.entry-points."typesafe_carla.sensor_plugins"]
carla_canvas = "carla_canvas.plugin:sensor_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "grpcio-tools>=1.84",
    "cyclonedds>=0.10",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}-{state}"
cmake.build-type = "Release"
install.components = ["carla_canvas"]
wheel.packages = ["python/carla_canvas"]
wheel.py-api = "py3"
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "python/carla_canvas/__init__.py"

[tool.scikit-build.cmake.define]
CARLA_CANVAS_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "."]
